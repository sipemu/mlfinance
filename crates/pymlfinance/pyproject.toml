[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pymlfinance"
version = "0.1.1"
description = "Python bindings for the mlfinance AFML toolkit"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
authors = [
    { name = "Simon Mueller" },
]
keywords = ["finance", "machine-learning", "quantitative-finance", "trading", "backtesting", "portfolio-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: Other/Proprietary License",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]
readme = "README.md"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/sipemu/mlfinance"
Documentation = "https://sipemu.github.io/mlfinance/"
Repository = "https://github.com/sipemu/mlfinance.git"
"Issue Tracker" = "https://github.com/sipemu/mlfinance/issues"

[project.optional-dependencies]
polars = ["polars>=1.0"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pymlfinance._native"
