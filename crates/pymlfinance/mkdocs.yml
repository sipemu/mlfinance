site_name: pymlfinance
site_description: Python bindings for the mlfinance AFML toolkit
site_url: https://sipemu.github.io/mlfinance/
repo_url: https://github.com/sipemu/mlfinance
repo_name: sipemu/mlfinance

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Polars Integration: polars.md
  - Examples:
      - Overview: examples-overview.md
      - Financial Data Structures: examples/ch02_financial_data_structures.ipynb
      - Labeling: examples/ch03_labeling.ipynb
      - Sample Weights: examples/ch04_sample_weights.ipynb
      - Fractional Differentiation: examples/ch05_fractional_differentiation.ipynb
      - Ensemble Methods: examples/ch06_ensemble_methods.ipynb
      - Cross-Validation: examples/ch07_cross_validation.ipynb
      - Feature Importance: examples/ch08_feature_importance.ipynb
      - Bet Sizing: examples/ch10_bet_sizing.ipynb
      - Backtesting Dangers: examples/ch11_backtesting_dangers.ipynb
      - Synthetic Data: examples/ch13_synthetic_data.ipynb
      - Backtest Statistics: examples/ch14_backtest_statistics.ipynb
      - Structural Breaks: examples/ch17_structural_breaks.ipynb
      - Entropy Features: examples/ch18_entropy_features.ipynb
      - Microstructure: examples/ch19_microstructure.ipynb
  - API Reference:
      - Core: api/core.md
      - Data: api/data.md
      - Labeling: api/labeling.md
      - Sampling: api/sampling.md
      - Features: api/features.md
      - Modeling: api/modeling.md
      - Backtesting: api/backtesting.md
      - Types: api/types.md
