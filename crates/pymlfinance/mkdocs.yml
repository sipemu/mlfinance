site_name: pymlfinance
site_description: Python bindings for the mlfinance AFML toolkit
site_url: https://sipemu.github.io/mlfinance/
repo_url: https://github.com/sipemu/mlfinance
repo_name: sipemu/mlfinance

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples:
      - Overview: examples-overview.md
      - Data Processing:
          - Ch 2 — Financial Data Structures: examples/ch02_financial_data_structures.ipynb
          - Ch 3 — Labeling: examples/ch03_labeling.ipynb
          - Ch 4 — Sample Weights: examples/ch04_sample_weights.ipynb
          - Ch 5 — Fractional Differentiation: examples/ch05_fractional_differentiation.ipynb
      - Feature Engineering:
          - Ch 17 — Structural Breaks: examples/ch17_structural_breaks.ipynb
          - Ch 18 — Entropy Features: examples/ch18_entropy_features.ipynb
          - Ch 19 — Microstructure: examples/ch19_microstructure.ipynb
      - Model Validation:
          - Ch 6 — Ensemble Methods: examples/ch06_ensemble_methods.ipynb
          - Ch 7 — Cross-Validation: examples/ch07_cross_validation.ipynb
          - Ch 8 — Feature Importance: examples/ch08_feature_importance.ipynb
      - Strategy & Backtesting:
          - Ch 10 — Bet Sizing: examples/ch10_bet_sizing.ipynb
          - Ch 11 — Backtesting Dangers: examples/ch11_backtesting_dangers.ipynb
          - Ch 13 — Synthetic Data: examples/ch13_synthetic_data.ipynb
          - Ch 14 — Backtest Statistics: examples/ch14_backtest_statistics.ipynb
          - Ch 15 — Strategy Risk: examples/ch15_strategy_risk.ipynb
      - Portfolio Allocation:
          - Ch 16 — Machine Learning Asset Allocation: examples/ch16_portfolio_allocation.ipynb
  - Polars: polars.md
  - API Reference:
      - Core: api/core.md
      - Data: api/data.md
      - Labeling: api/labeling.md
      - Sampling: api/sampling.md
      - Features: api/features.md
      - Modeling: api/modeling.md
      - Backtesting: api/backtesting.md
      - Types: api/types.md
