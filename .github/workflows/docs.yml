name: Docs

on:
  push:
    branches: [main]
    paths:
      - "crates/pymlfinance/docs/**"
      - "crates/pymlfinance/python/**"
      - "crates/pymlfinance/mkdocs.yml"
      - "crates/pymlfinance/examples/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mkdocs-material "mkdocstrings[python]" mkdocs-jupyter
      - name: Build and deploy
        working-directory: crates/pymlfinance
        run: mkdocs gh-deploy --force
